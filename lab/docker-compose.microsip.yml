name: mss-microsip

# A real softphone calling into the lab: MicroSIP -> OpenSIPS -> rtpengine ->
# FreeSWITCH, with mediaserverd tapping the call and stream-llm-bridge echoing
# what you say. Run it with:
#
#   docker compose -f docker-compose.microsip.yml up
#
# MicroSIP points at 127.0.0.1:5060. Dial 9196 first -- that is FreeSWITCH's own
# echo, so if you cannot hear yourself there the problem is SIP/RTP reachability
# and nothing in this project. Then dial 9000, which answers and holds silent,
# so the only audio you hear is what MSS injects.
#
# Addresses are static because rtpengine has to advertise one it can be reached
# at. The softphone is outside the docker network and can only reach a published
# port, so rtpengine's "external" interface advertises 127.0.0.1 while
# "internal" keeps the container address for FreeSWITCH and the tap.

services:
  rtpengine:
    image: jambonz/rtpengine
    command:
      - rtpengine
      - --table=-1
      - --recording-dir=/tmp
      - --interface=internal/172.31.99.10
      - --interface=external/172.31.99.10!127.0.0.1
      - --port-min=30000
      - --port-max=30099
    ports:
      # One tapped two-party call costs four port pairs: one per call leg and
      # one per tap stream. 21 ports (the range this lab used until item 19)
      # therefore held exactly two tapped calls, and the soak suite needs more
      # than two. 100 ports is 50 pairs, so ~12 concurrent tapped calls with
      # room for the ports rtpengine holds briefly after a teardown.
      - "30000-30099:30000-30099/udp"
    networks:
      lab:
        ipv4_address: 172.31.99.10

  opensips:
    image: opensips/opensips:3.4
    depends_on: [rtpengine, redpanda, redis]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - sed "s/__ADVERTISED_IP__/${ADVERTISED_IP:-127.0.0.1}/" /etc/opensips/opensips.cfg.tmpl > /tmp/opensips.cfg && exec /usr/sbin/opensips -F -f /tmp/opensips.cfg
    volumes:
      - ./opensips/opensips.cfg:/etc/opensips/opensips.cfg.tmpl:ro
    ports:
      - "5060:5060/udp"
    networks:
      lab:
        ipv4_address: 172.31.99.70

  freeswitch:
    image: rig-freeswitch:latest
    volumes:
      - ./freeswitch/internal.xml:/etc/freeswitch/sip_profiles/internal.xml:ro
    environment:
      FS_EXT_IP: 172.31.99.80
      RTP_START_PORT: "16384"
      RTP_END_PORT: "16484"
    networks:
      lab:
        ipv4_address: 172.31.99.80

  llm-bridge:
    image: stream-llm-bridge:local
    environment:
      SERVER_PORT: "8080"
      LOG_LEVEL: debug
      USE_LLM: "false"
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:?set it in lab/.env}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:?deepgram is what turns your speech into the echo}
      DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:-nova-3}
      WELCOME_MESSAGE: ${WELCOME_MESSAGE:-Hello, I am listening. Say something and I will repeat it.}
      AZURE_API_KEY: ${AZURE_API_KEY:-}
      AZURE_ENDPOINT: ${AZURE_ENDPOINT:-}
      AZURE_DEPLOYMENT: ${AZURE_DEPLOYMENT:-}
      AZURE_API_VERSION: ${AZURE_API_VERSION:-}
      AZURE_SYSTEM_PROMPT: ${AZURE_SYSTEM_PROMPT:-}
    networks:
      lab:
        ipv4_address: 172.31.99.50

  # Consumer 2: real-time transcription. Same fan-out feed, its own Deepgram
  # stream per track, transcripts appended to out/transcript-<callSid>.txt.
  rtt-service:
    image: python:3-slim
    volumes:
      - ./rtt_service.py:/rtt_service.py:ro
      - ./out:/out
    command: ["python3", "/rtt_service.py"]
    environment:
      RTT_PORT: "8091"
      OUT_DIR: /out
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:-nova-3}
    networks:
      lab:
        ipv4_address: 172.31.99.100

  # Consumer 3: recording. Writes out/recording-<callSid>.wav, customer left,
  # agent right, the same channel convention the tap artifact uses.
  recorder-service:
    image: python:3-slim
    volumes:
      - ./recorder_service.py:/recorder_service.py:ro
      - ./out:/out
    command: ["python3", "/recorder_service.py"]
    environment:
      RECORDER_PORT: "8090"
      OUT_DIR: /out
      RIGHT_TRACK: outbound
    networks:
      lab:
        ipv4_address: 172.31.99.110

  call-watcher:
    image: python:3-slim
    depends_on: [rtpengine]
    volumes:
      - ./call_watcher.py:/call_watcher.py:ro
      - shared:/shared
    command: ["python3", "/call_watcher.py"]
    environment:
      NG_NODE: 172.31.99.10
    networks:
      lab:
        ipv4_address: 172.31.99.90

  mediaserverd:
    image: mss-lab-rust:1.95
    build:
      context: .
      dockerfile: Dockerfile.rust
    working_dir: /build
    command: ["/lab/tap_live_call.sh"]
    depends_on: [opensips, freeswitch, llm-bridge, call-watcher, rtt-service, recorder-service]
    volumes:
      - ..:/build:ro
      - ./tap_live_call.sh:/lab/tap_live_call.sh:ro
      - shared:/shared
      - lab-target:/target
      - lab-registry:/usr/local/cargo/registry
      - lab-rustup:/usr/local/rustup
      - ./out:/out
    environment:
      CARGO_TARGET_DIR: /target
      RUST_LOG: info
      MSS_RTPENGINE_NODE: 172.31.99.10:22222
      MSS_TAP_TRANSCODE: ${MSS_TAP_TRANSCODE:-on}
      MSS_TAP_LOCAL_IP: 172.31.99.30
      MSS_TAP_SECONDS: "900"
      MSS_TAP_OUTPUT: /out/microsip_tap.wav
      MSS_TAP_DATAGRAM_LOG_DIR: /out
      MSS_CONSUMER_URL: ws://172.31.99.50:8080/ws
      MSS_CONSUMER_ACCOUNT_ID: lab-account
      MSS_CONSUMER_STREAM_SID: MZ-microsip
      MSS_LISTENERS: rtt=ws://172.31.99.100:8091/ws,recorder=ws://172.31.99.110:8090/ws
    networks:
      lab:
        ipv4_address: 172.31.99.30

  redpanda:
    image: redpandadata/redpanda:v24.2.4
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --kafka-addr=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr=INTERNAL://172.31.99.60:9092,EXTERNAL://127.0.0.1:19092
    ports:
      - "19092:19092"
    networks:
      lab:
        ipv4_address: 172.31.99.60

  # Recording storage for phase 2. S3-compatible, so mediaserverd talks to it
  # with the same object_store client it uses against real S3 -- only the
  # endpoint and the credentials differ. The console is on 9001 if you want to
  # click through the bucket; `mc` lives inside the container for scripting.
  minio:
    image: quay.io/minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      lab:
        ipv4_address: 172.31.99.62

  # object_store does not create buckets, and MSS deliberately does not either:
  # a recorder that can create buckets can also create typos.
  minio-init:
    image: quay.io/minio/minio:latest
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - until mc alias set lab http://172.31.99.62:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do sleep 1; done && mc mb --ignore-existing lab/${MSS_RECORDING_BUCKET:-lab-recordings} && mc ls lab
    networks:
      lab:
        ipv4_address: 172.31.99.63

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "16379:6379"
    networks:
      lab:
        ipv4_address: 172.31.99.61

  mss-control:
    image: mss-lab-rust:1.95
    build:
      context: .
      dockerfile: Dockerfile.rust
    working_dir: /build
    command: ["cargo", "run", "--quiet", "-p", "mediaserverd"]
    depends_on: [rtpengine, minio-init]
    volumes:
      - ..:/build:ro
      - lab-target:/target
      - lab-registry:/usr/local/cargo/registry
      - lab-rustup:/usr/local/rustup
      - ./out:/out
    environment:
      CARGO_TARGET_DIR: /target
      RUST_LOG: info
      MSS_CONTROL_LISTEN: 0.0.0.0:50551
      MSS_METRICS_LISTEN: 0.0.0.0:9464
      MSS_POD_NAME: lab-control
      MSS_RTPENGINE_NODE: 172.31.99.10:22222
      MSS_TAP_TRANSCODE: ${MSS_TAP_TRANSCODE:-on}
      MSS_TAP_LOCAL_IP: 172.31.99.31
      MSS_KAFKA_BROKERS: 172.31.99.60:9092
      MSS_REDIS_URL: redis://172.31.99.61:6379
      MSS_RECORDING_BUCKET: ${MSS_RECORDING_BUCKET:-lab-recordings}
      MSS_RECORDING_S3_ENDPOINT: http://172.31.99.62:9000
      MSS_RECORDING_S3_REGION: us-east-1
      MSS_RECORDING_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      MSS_RECORDING_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MSS_RECORDING_SPILL_DIR: /out/recordings
      MSS_MEDIA_PORT_MIN: ${MSS_MEDIA_PORT_MIN:-}
      MSS_MEDIA_PORT_MAX: ${MSS_MEDIA_PORT_MAX:-}
      MSS_MEDIA_ADVERTISE_IP: ${MSS_MEDIA_ADVERTISE_IP:-}
      MSS_DRAIN_TIMEOUT_SECS: ${MSS_DRAIN_TIMEOUT_SECS:-}
      MSS_HEALTH_PROBE_INTERVAL_SECS: ${MSS_HEALTH_PROBE_INTERVAL_SECS:-}
    ports:
      - "50551:50551"
      - "9464:9464"
    networks:
      lab:
        ipv4_address: 172.31.99.31

  # The second and third pods, for the pod-kill re-subscribe drill (item 11).
  # Identical to mss-control except for the three things that must differ: the
  # pod name, the published ports, and the address rtpengine sends the tap to.
  # Same MSS_REDIS_URL is the whole point -- that shared registry is what lets
  # one of them adopt a session whose owner died, and having *two* survivors is
  # what makes "exactly one adopter" a real assertion rather than a tautology.
  # They share the build cache volume, so they start without recompiling.
  mss-control-b:
    image: mss-lab-rust:1.95
    build:
      context: .
      dockerfile: Dockerfile.rust
    working_dir: /build
    command: ["cargo", "run", "--quiet", "-p", "mediaserverd"]
    depends_on: [rtpengine, minio-init]
    volumes:
      - ..:/build:ro
      - lab-target:/target
      - lab-registry:/usr/local/cargo/registry
      - lab-rustup:/usr/local/rustup
      - ./out:/out
    environment:
      CARGO_TARGET_DIR: /target
      RUST_LOG: info
      MSS_CONTROL_LISTEN: 0.0.0.0:50551
      MSS_METRICS_LISTEN: 0.0.0.0:9464
      MSS_POD_NAME: lab-control-b
      MSS_RTPENGINE_NODE: 172.31.99.10:22222
      MSS_TAP_TRANSCODE: ${MSS_TAP_TRANSCODE:-on}
      MSS_TAP_LOCAL_IP: 172.31.99.32
      MSS_KAFKA_BROKERS: 172.31.99.60:9092
      MSS_REDIS_URL: redis://172.31.99.61:6379
      MSS_RECORDING_BUCKET: ${MSS_RECORDING_BUCKET:-lab-recordings}
      MSS_RECORDING_S3_ENDPOINT: http://172.31.99.62:9000
      MSS_RECORDING_S3_REGION: us-east-1
      MSS_RECORDING_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      MSS_RECORDING_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MSS_RECORDING_SPILL_DIR: /out/recordings
      MSS_MEDIA_PORT_MIN: ${MSS_MEDIA_PORT_MIN:-}
      MSS_MEDIA_PORT_MAX: ${MSS_MEDIA_PORT_MAX:-}
      MSS_MEDIA_ADVERTISE_IP: ${MSS_MEDIA_ADVERTISE_IP:-}
      MSS_DRAIN_TIMEOUT_SECS: ${MSS_DRAIN_TIMEOUT_SECS:-}
      MSS_HEALTH_PROBE_INTERVAL_SECS: ${MSS_HEALTH_PROBE_INTERVAL_SECS:-}
    ports:
      - "50552:50551"
      - "9465:9464"
    networks:
      lab:
        ipv4_address: 172.31.99.32

  mss-control-c:
    image: mss-lab-rust:1.95
    build:
      context: .
      dockerfile: Dockerfile.rust
    working_dir: /build
    command: ["cargo", "run", "--quiet", "-p", "mediaserverd"]
    depends_on: [rtpengine, minio-init]
    volumes:
      - ..:/build:ro
      - lab-target:/target
      - lab-registry:/usr/local/cargo/registry
      - lab-rustup:/usr/local/rustup
      - ./out:/out
    environment:
      CARGO_TARGET_DIR: /target
      RUST_LOG: info
      MSS_CONTROL_LISTEN: 0.0.0.0:50551
      MSS_METRICS_LISTEN: 0.0.0.0:9464
      MSS_POD_NAME: lab-control-c
      MSS_RTPENGINE_NODE: 172.31.99.10:22222
      MSS_TAP_TRANSCODE: ${MSS_TAP_TRANSCODE:-on}
      MSS_TAP_LOCAL_IP: 172.31.99.33
      MSS_KAFKA_BROKERS: 172.31.99.60:9092
      MSS_REDIS_URL: redis://172.31.99.61:6379
      MSS_RECORDING_BUCKET: ${MSS_RECORDING_BUCKET:-lab-recordings}
      MSS_RECORDING_S3_ENDPOINT: http://172.31.99.62:9000
      MSS_RECORDING_S3_REGION: us-east-1
      MSS_RECORDING_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      MSS_RECORDING_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MSS_RECORDING_SPILL_DIR: /out/recordings
      MSS_MEDIA_PORT_MIN: ${MSS_MEDIA_PORT_MIN:-}
      MSS_MEDIA_PORT_MAX: ${MSS_MEDIA_PORT_MAX:-}
      MSS_MEDIA_ADVERTISE_IP: ${MSS_MEDIA_ADVERTISE_IP:-}
      MSS_DRAIN_TIMEOUT_SECS: ${MSS_DRAIN_TIMEOUT_SECS:-}
      MSS_HEALTH_PROBE_INTERVAL_SECS: ${MSS_HEALTH_PROBE_INTERVAL_SECS:-}
    ports:
      - "50553:50551"
      - "9466:9464"
    networks:
      lab:
        ipv4_address: 172.31.99.33

volumes:
  lab-target:
  lab-registry:
  lab-rustup:
  shared:

networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.99.0/24
