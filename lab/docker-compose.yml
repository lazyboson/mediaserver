name: mss-lab

services:
  rtpengine:
    image: jambonz/rtpengine
    command: ["rtpengine", "--table=-1"]
    tmpfs:
      - /rec:mode=1777
    networks:
      lab:
        ipv4_address: 172.31.99.10

  call-driver:
    image: python:3-slim
    depends_on: [rtpengine]
    volumes:
      - ./call_driver.py:/call_driver.py:ro
      - ./out:/out
    command: ["python3", "/call_driver.py"]
    environment:
      EAR_DIR: /out
      PUMP_SILENCE: ${PUMP_SILENCE:-}
      NG_NODE: 172.31.99.10
      NG_PORT: "22222"
      SELF_IP: 172.31.99.20
      CALL_ID: lab-call-1
      FROM_TAG: tagA
      TO_TAG: tagB
      PUMP_SECONDS: "60"
      READY_FILE: /tmp/call-ready
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/call-ready"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 2s
    networks:
      lab:
        ipv4_address: 172.31.99.20

  # The default consumer. It speaks the same Twilio Media Streams dialect the
  # real bridge does, needs no API keys and spends no external calls, so
  # `docker compose up` works from a clean clone -- which is what the "Running
  # it" section of docs/lab.md has always claimed. Swap in the real bridge with
  # `--profile real` (and MSS_CONSUMER_URL, below).
  bridge:
    image: python:3-slim
    volumes:
      - ./mock_bridge.py:/mock_bridge.py:ro
    command: ["python3", "/mock_bridge.py"]
    environment:
      BRIDGE_PORT: "8080"
      SPEAK_AFTER_SECONDS: "4"
      SPEAK_EVERY_SECONDS: "5"
    networks:
      lab:
        ipv4_address: 172.31.99.40

  # The real thing, built from ../../stream-llm-bridge with:
  #   docker build -t stream-llm-bridge:local .
  # Keys come from lab/.env, which is gitignored. Behind a profile because it
  # needs an image built outside this repo and two paid API keys:
  #
  #   docker compose --profile real up \
  #     -e MSS_CONSUMER_URL=ws://172.31.99.50:8080/ws
  #
  # The keys below default to empty rather than `:?`, because compose
  # interpolates every service in the file before it filters by profile: a `:?`
  # here refused to parse the file at all, so `docker compose up rtpengine`
  # failed for want of a text-to-speech key. The bridge itself reports a
  # missing key, which is the right place for that error.
  llm-bridge:
    image: stream-llm-bridge:local
    profiles: [real]
    environment:
      SERVER_PORT: "8080"
      LOG_LEVEL: debug
      USE_LLM: "false"
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:-nova-3}
      WELCOME_MESSAGE: ${WELCOME_MESSAGE:-Hello from the media server.}
    networks:
      lab:
        ipv4_address: 172.31.99.50

  mediaserverd:
    # media-core -> opus-ffi -> opusic-sys builds a vendored libopus with cmake,
    # which plain rust:slim does not carry, so this is the same image the
    # microsip lab uses rather than the bare toolchain image.
    image: mss-lab-rust:1.95
    build:
      context: .
      dockerfile: Dockerfile.rust
    working_dir: /build
    command: ["cargo", "run", "--quiet", "-p", "mediaserverd"]
    depends_on:
      bridge:
        condition: service_started
      call-driver:
        condition: service_healthy
    volumes:
      - ..:/build:ro
      - lab-target:/target
      - lab-registry:/usr/local/cargo/registry
      - lab-rustup:/usr/local/rustup
      - ./out:/out
    environment:
      CARGO_TARGET_DIR: /target
      RUST_LOG: info
      MSS_RTPENGINE_NODE: 172.31.99.10:22222
      MSS_TAP_LOCAL_IP: 172.31.99.30
      MSS_TAP_CALL_ID: lab-call-1
      MSS_TAP_FROM_TAGS: tagA,tagB
      MSS_TAP_SECONDS: "15"
      MSS_TAP_OUTPUT: /out/tap.wav
      MSS_TAP_DATAGRAM_LOG_DIR: /out
      MSS_CONSUMER_URL: ${MSS_CONSUMER_URL:-ws://172.31.99.40:8080/ws}
      MSS_CONSUMER_ACCOUNT_ID: lab-account
      MSS_CONSUMER_STREAM_SID: MZ-lab-1
    networks:
      lab:
        ipv4_address: 172.31.99.30

volumes:
  lab-target:
  lab-registry:
  lab-rustup:

networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.99.0/24
