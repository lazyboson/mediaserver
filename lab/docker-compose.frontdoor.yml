# MSS answers the SIP itself. This overlay REPLACES docker-compose.shim.yml.
#
# lab/sip_shim.py was a minimal Python UAS standing between a B2BUA and
# MediaControl.CreateSession. Since the sip-uas work, mediaserverd carries its
# own UAS -- RFC 3261 section 17 transactions, section 12 dialogs, RFC 4028
# session timers -- so the intermediary is deleted rather than replaced. The
# dialled user part is still the conference group, which is the contract the
# shim established and the front door keeps.
#
# Use it exactly where docker-compose.shim.yml was used, and never together
# with it -- both would want to answer the same INVITE:
#
#   DOCKER_API_VERSION=1.43 SHIM_TARGET=172.31.99.31:5080 docker compose \
#     -f lab/docker-compose.microsip.yml -f lab/docker-compose.frontdoor.yml \
#     up -d rtpengine opensips redis redpanda minio minio-init mss-control
#
# SHIM_TARGET is what the proxy configs route the shim extension to, so moving
# it from 172.31.99.14 (the shim container) to 172.31.99.31 (mediaserverd) is
# the whole routing change on the proxy side. A B2BUA that bridges by IP --
# the prodfs FreeSWITCH does, in its own dialplan -- needs the same address
# changed there.

services:

  mss-control:
    environment:
      # The one port a stranger can address. It is its own trust boundary and
      # carries no bearer check, so on anything but a lab network it belongs
      # behind a firewall that admits only the signalling elements.
      MSS_SIP_LISTEN: 0.0.0.0:5080
      # What goes in the Contact of every answer: where the peer sends its ACK
      # and its BYE. It must be the address the *peer* can reach, which is why
      # it is not just the listen address.
      MSS_SIP_ADVERTISE: ${MSS_SIP_ADVERTISE:-172.31.99.31:5080}
