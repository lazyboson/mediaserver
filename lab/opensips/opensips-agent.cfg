#
# The agent-side proxy: a WebRTC browser reaches FreeSWITCH through this one,
# anchored in the *second* rtpengine (172.31.99.11), so a lab call has its two
# legs on two different rtpengine nodes -- the production topology
# (architecture.md section 2: RE1 at the carrier interconnect, RE2 on the agent
# side) that the single-rtpengine lab could never reproduce.
#
# It is opensips.cfg with three differences, and nothing else:
#   1. proto_ws, so a browser can speak SIP at all (browsers have no UDP SIP).
#   2. rtpengine_sock points at RE2 instead of RE1.
#   3. the rtpengine flags bridge WebRTC to plain RTP: ICE and DTLS-SRTP are
#      terminated here, and FreeSWITCH is handed RTP/AVP as if the agent were
#      an ordinary SIP phone.
#
# The flag sets are the standard rtpengine WebRTC recipe. They are printed by
# webrtc_agent_drill.sh on every run (the SDP in and the SDP out) precisely
# because "standard recipe" is not evidence -- read them once on the first run
# of a new rtpengine build.
#
# __ADVERTISED_IP__, __RTPE_OFFER_DIR__ and __RTPE_ANSWER_DIR__ are substituted
# at container start. The directions matter and differ by where the browser
# runs: a browser on the Windows host is *outside* the docker network and must
# be told the address rtpengine publishes ("external"), while the headless
# Chrome the drill uses lives inside it ("internal"). Getting this wrong gives
# a call that signals perfectly and carries no audio -- the same failure the
# customer-leg config documents at length.
#

log_level=3
stderror_enabled=yes
syslog_enabled=no
udp_workers=2

mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"

loadmodule "proto_udp.so"
loadmodule "proto_ws.so"
loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
# $shv lives in cfgutils and every name must be declared up front;
# an undeclared one is a config parse error, not an empty value.
loadmodule "cfgutils.so"
loadmodule "nathelper.so"
loadmodule "rtpengine.so"

socket=udp:0.0.0.0:5060 as __ADVERTISED_IP__:5060
socket=ws:0.0.0.0:5062 as __ADVERTISED_IP__:5062

modparam("usrloc", "db_mode", 0)
modparam("rr", "append_fromtag", 1)
modparam("tm", "fr_timeout", 5)
modparam("tm", "fr_inv_timeout", 40)
modparam("rtpengine", "rtpengine_sock", "udp:172.31.99.11:22222")
modparam("cfgutils", "shvset", "agent_du=s:none")

# A browser's Contact carries a transport=ws parameter and an ephemeral
# hostname; the proxy must keep the websocket it arrived on to reach it again,
# which is what a saved location entry plus loose routing gives us. Registration
# is optional for the drill (the browser originates), and required only for the
# FS-dials-the-agent direction.
modparam("registrar", "tcp_persistent_flag", "TCP_PERSISTENT")

route {
    if (!mf_process_maxfwd_header(10)) {
        send_reply(483, "Too Many Hops");
        exit;
    }

    if (has_totag()) {
        if (loose_route()) {
            if (is_method("BYE")) {
                rtpengine_delete();
            }
            if (is_method("INVITE")) {
                record_route();
            }
            t_relay();
            exit;
        }
        send_reply(404, "Not Here");
        exit;
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            t_relay();
        }
        exit;
    }

    if (is_method("REGISTER")) {
        setflag("TCP_PERSISTENT");
        # A WebSocket UA's Contact host is deliberately unresolvable -- JsSIP
        # registers as sip:xxxx@yyyy.invalid;transport=ws, per RFC 7118, because
        # the only way back to a browser is the websocket it arrived on. Without
        # this line lookup() hands tm a hostname to resolve, resolution fails,
        # and the call dies with "failure to add branches" and no reply at all.
        # fix_nated_register() records where the registration really came from,
        # and lookup() then routes to that connection.
        fix_nated_register();
        # And remember the connection itself. fix_nated_register() plus
        # lookup() is the documented recipe and it still left tm resolving
        # "yyyy.invalid" on this build, so the address the registration
        # actually arrived from is kept here and used as the outbound
        # destination below. One agent per lab, so one shared variable is
        # enough; a real deployment wants Path or outbound instead.
        $shv(agent_du) = "sip:" + $si + ":" + $sp + ";transport=ws";
        xlog("L_INFO", "agent reachable at $shv(agent_du)\n");
        if (!save("location")) {
            xlog("L_ERR", "could not save $tu to location\n");
        }
        xlog("L_INFO", "agent registered $tu from $si:$sp\n");
        exit;
    }

    if (is_method("OPTIONS")) {
        send_reply(200, "OK");
        exit;
    }

    if (is_method("INVITE")) {
        xlog("L_INFO", "agent call to $rU from $fu, sip call-id $ci\n");
        record_route();

        # Direction decides everything here, and the source address is what
        # tells them apart: FreeSWITCH originating a call to the agent needs
        # the WebRTC side *built*, while the browser calling in needs it
        # *removed*. Same proxy, same rtpengine, opposite flags.
        if ($si == "172.31.99.80") {
            # FreeSWITCH -> browser: the offer that leaves here must be a
            # WebRTC offer, so ICE candidates, DTLS-SRTP (rtpengine passive, the
            # browser drives the handshake) and rtcp-mux all go back in.
            rtpengine_offer("__RTPE_ANSWER_DIR__ ICE=force RTP/SAVPF DTLS=passive rtcp-mux-offer generate-mid");
            if ($shv(agent_du) == "none") {
                xlog("L_ERR", "no agent has registered; nothing to ring\n");
                rtpengine_delete();
                send_reply(404, "Agent Not Registered");
                exit;
            }
            # Deliberately not lookup(): its Request-URI is the browser's
            # unresolvable .invalid contact, and a stale registration would
            # fork a second branch at the same websocket. The Request-URI stays
            # as FreeSWITCH addressed it and only the destination is rewritten,
            # which is the one thing that has to be a real socket.
            $du = $shv(agent_du);
            xlog("L_INFO", "ringing the agent at $du\n");
            t_on_reply("agent_reply");
            t_on_failure("relay_failure");
            if (!t_relay()) {
                send_reply(500, "Relay Failed");
            }
            exit;
        }

        # Browser -> FreeSWITCH. ICE=remove and RTP/AVP strip the WebRTC-only
        # parts so FreeSWITCH sees a plain phone; rtcp-mux-demux splits the
        # muxed RTCP the browser insists on into the separate port FreeSWITCH
        # expects. DTLS is terminated on the browser side by rtpengine, which
        # is why nothing here mentions certificates.
        rtpengine_offer("__RTPE_OFFER_DIR__ ICE=remove RTP/AVP rtcp-mux-demux __RTPE_CODEC_FLAGS__");

        $du = "sip:172.31.99.80:5060";
        t_on_reply("relay_reply");
        t_on_failure("relay_failure");
        if (!t_relay()) {
            send_reply(500, "Relay Failed");
        }
        exit;
    }

    send_reply(405, "Method Not Allowed");
}

onreply_route[relay_reply] {
    if (has_body("application/sdp")) {
        xlog("L_INFO", "agent answer sdp on $ci, status $rs\n");
        # FreeSWITCH -> browser. The answer has to put back everything the
        # offer removed: ICE candidates, DTLS-SRTP (rtpengine as the passive
        # end, so the browser drives the handshake) and rtcp-mux.
        rtpengine_answer("__RTPE_ANSWER_DIR__ ICE=force RTP/SAVPF DTLS=passive rtcp-mux-offer");
    }
}

onreply_route[agent_reply] {
    if (has_body("application/sdp")) {
        xlog("L_INFO", "agent picked up on $ci, status $rs\n");
        # The browser's answer is a WebRTC answer; FreeSWITCH must not see any
        # of it. This is the mirror of the offer above.
        rtpengine_answer("__RTPE_OFFER_DIR__ ICE=remove RTP/AVP rtcp-mux-demux __RTPE_CODEC_FLAGS__");
    }
}

failure_route[relay_failure] {
    xlog("L_ERR", "agent call $ci failed\n");
    rtpengine_delete();
}
