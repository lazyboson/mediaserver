#
# A minimal lab proxy: register a softphone, anchor its media in rtpengine,
# relay the call to FreeSWITCH. This is NOT the upstream platform's production routing --
# no database, no auth, no carrier logic, one route block. It exists so a real
# softphone reaches the lab through the same OpenSIPS + rtpengine mechanics
# production uses, instead of the lab fabricating calls over NG directly.
#
# The socket advertises __ADVERTISED_IP__ (substituted at container start from
# ADVERTISED_IP) because Via and Record-Route otherwise carry the container
# address, which the softphone on Windows cannot route to -- its BYE then dies
# in transit and every call zombies, kept alive forever by FreeSWITCH's
# silence stream refreshing rtpengine's timeout.
#
# Node discovery (item G11) is templated and OFF by default. When DISCOVERY=on
# is substituted in, this proxy publishes call-id -> rtpengine node into the
# same Redis MSS reads, so a CreateSession that names no node still lands on
# the rtpengine anchoring that call. The lab writes it through exec.so +
# /lab/discovery_publish.py because this image has no cachedb_redis.so; the key
# and value are exactly what docs/deploy.md's cache_store snippet writes.
#
# The bridging flags matter. MicroSIP lives outside the docker network and can
# only reach a published port, so it must be told to send RTP to the address
# rtpengine advertises on its "external" interface. FreeSWITCH lives inside and
# must be given the container address on "internal". Hence ei on the offer
# (in from external, out to internal) and ie on the reply.
#

log_level=3
stderror_enabled=yes
syslog_enabled=no
udp_workers=4

socket=udp:0.0.0.0:5060 as __ADVERTISED_IP__:5060

mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"

loadmodule "proto_udp.so"
loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
loadmodule "rtpengine.so"
loadmodule "exec.so"

modparam("usrloc", "db_mode", 0)
modparam("rr", "append_fromtag", 1)
modparam("tm", "fr_timeout", 5)
modparam("tm", "fr_inv_timeout", 40)
modparam("rtpengine", "rtpengine_sock", "udp:172.31.99.10:22222")
modparam("exec", "time_to_kill", 2)

route {
    if (!mf_process_maxfwd_header(10)) {
        send_reply(483, "Too Many Hops");
        exit;
    }

    if (has_totag()) {
        if (loose_route()) {
            if (is_method("BYE")) {
                rtpengine_delete();
                $var(discovery) = "__DISCOVERY__";
                if ($var(discovery) == "on") {
                    exec("/lab/discovery_publish.py remove __DISCOVERY_PREFIX__$ci");
                }
            }
            if (is_method("INVITE")) {
                record_route();
            }
            t_relay();
            exit;
        }
        send_reply(404, "Not Here");
        exit;
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            t_relay();
        }
        exit;
    }

    if (is_method("REGISTER")) {
        if (!save("location")) {
            xlog("L_ERR", "could not save $tu to location\n");
        }
        xlog("L_INFO", "registered $tu from $si:$sp\n");
        exit;
    }

    if (is_method("OPTIONS")) {
        send_reply(200, "OK");
        exit;
    }

    if (is_method("INVITE")) {
        xlog("L_INFO", "call to $rU from $fu, sip call-id $ci\n");
        record_route();
        rtpengine_offer("external internal");
        $var(discovery) = "__DISCOVERY__";
        if ($var(discovery) == "on") {
            exec("/lab/discovery_publish.py store __DISCOVERY_PREFIX__$ci __DISCOVERY_TTL__ __DISCOVERY_NODE__ $ft");
        }
        $du = "sip:172.31.99.80:5060";
        t_on_reply("relay_reply");
        t_on_failure("relay_failure");
        if (!t_relay()) {
            send_reply(500, "Relay Failed");
        }
        exit;
    }

    send_reply(405, "Method Not Allowed");
}

onreply_route[relay_reply] {
    if (has_body("application/sdp")) {
        xlog("L_INFO", "answer sdp on $ci, status $rs\n");
        rtpengine_answer("internal external");
        $var(discovery) = "__DISCOVERY__";
        if ($var(discovery) == "on") {
            exec("/lab/discovery_publish.py store __DISCOVERY_PREFIX__$ci __DISCOVERY_TTL__ __DISCOVERY_NODE__ $ft $tt");
        }
    }
}

failure_route[relay_failure] {
    xlog("L_ERR", "call $ci failed\n");
    rtpengine_delete();
    $var(discovery) = "__DISCOVERY__";
    if ($var(discovery) == "on") {
        exec("/lab/discovery_publish.py remove __DISCOVERY_PREFIX__$ci");
    }
}
