// MSS control plane — the noun-oriented API from docs/architecture.md §5.1,
// and the event schema from §5.4.
//
// This is deliberately NOT a mirror of the legacy the legacy verb API.proto: those names
// (StreamPause, StreamSendText, StartCallTranscription) describe how
// FreeSWITCH does it, and Phase 3/4 — inline legs, mixing, whisper — do not
// fit that vocabulary. TelCompat (§5.6) speaks the legacy controller's verbs
// onto these nouns until that controller no longer needs them.
//
// Field numbers are provisional until first release, frozen after
// (Constitution, Article VII).

syntax = "proto3";

package mss.v1;

import "google/protobuf/timestamp.proto";

service MediaControl {
  rpc CreateSession(CreateSessionRequest) returns (Session);
  rpc DestroySession(SessionRef) returns (Ack);
  rpc DescribeSession(SessionRef) returns (Session);

  rpc Attach(AttachRequest) returns (Attachment);
  rpc Detach(AttachmentRef) returns (Ack);
  rpc UpdateAttachment(UpdateAttachmentRequest) returns (Attachment);
  rpc SendToAttachment(SendToAttachmentRequest) returns (Ack);

  rpc StartPlayback(StartPlaybackRequest) returns (Playback);
  rpc StopPlayback(PlaybackRef) returns (Ack);

  // Debug and direct consumers only. The production event path is Kafka
  // "mss.events" (§5.4) — a gRPC event stream would reintroduce fan-out,
  // ordering, restart-without-loss and replay, all of which the bus solves.
  rpc WatchEvents(WatchRequest) returns (stream MediaEvent);
}

// ---------------------------------------------------------------- sessions

enum SessionKind {
  SESSION_KIND_UNSPECIFIED = 0;
  SESSION_KIND_TAP = 1;     // phase 1-2: rtpengine subscription, listen-only
  SESSION_KIND_INLINE = 2;  // phase 3: MSS is an RTP endpoint in the path
  SESSION_KIND_MIX = 3;     // phase 4: the conference room itself, as a
                            // session with no leg (CreateSession{kind=MIX,
                            // group}). It owns the room's clock, its mixed
                            // track and therefore its recording.
}

enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  SESSION_STATE_ACTIVE = 1;
  SESSION_STATE_ENDED = 2;
}

message CreateSessionRequest {
  // The legacy controller keys everything by channel UUID because FreeSWITCH
  // owns the channel; MSS keys by (call_id, from_tags, node) because
  // rtpengine does. external_id is the caller's own correlation id (the
  // legacy request_uuid) and the Kafka partition key.
  string external_id = 1;
  SessionKind kind = 2;
  string call_id = 3;
  repeated string from_tags = 4;
  // Resolved through the OpenSIPS -> Redis map when empty (M2 discovery).
  string rtpengine_node = 5;
  bool mix = 6;
  // A retry during pod loss must not create a second session.
  string idempotency_key = 7;
  // INLINE only: the peer's SDP offer. MSS answers as an RTP endpoint and
  // returns the answer in Session.sdp_answer. A tap needs no SDP: it asks
  // rtpengine for a copy instead.
  string sdp_offer = 8;
  // INLINE and MIX: the conference this session belongs to, mirroring the
  // recording group on AttachRequest. On a MIX session the group is
  // required and names the room this session *is*: it has no leg, no
  // call_id and no sdp_offer, its opened_at_unix_ms is the conference's own
  // open instant, and a FILE_S3 attachment with selector only=mixed on it
  // records the room from open to close however its members come and go.
  // On an INLINE session it names the conference the leg joins.
  // Legs naming the same group share one mix matrix
  // driven by one capture-world clock, hear every other member but not
  // themselves, and publish the conference mix as the "mixed" track on every
  // member session. Empty is a plain two-party inline leg, which is exactly
  // what an inline session was before conferences existed. All members must
  // have negotiated the same sample rate and ptime; a mismatch is refused by
  // name rather than resampled.
  string group = 9;
}

message Session {
  string session_id = 1;
  string external_id = 2;
  SessionKind kind = 3;
  SessionState state = 4;
  string call_id = 5;
  repeated string from_tags = 6;
  string rtpengine_node = 7;
  string owner_pod = 8;
  repeated Attachment attachments = 9;
  // INLINE only: what MSS answered the peer's offer with. Bound to the pod
  // that answered it, which is why an inline session is not adoptable.
  string sdp_answer = 10;
  // INLINE only: the conference this leg is mixed into, empty when it is a
  // plain two-party leg.
  string group = 11;
  // How this session's track names were arrived at: "explicit" (the caller's
  // from-tag was supplied), "inferred" (rtpengine's participant creation times
  // ordered them) or "unknown" (they tie, so no direction is claimed and the
  // tracks are named leg_a / leg_b). D17: rtpengine stamps both legs of one
  // dialogue with the same second, so "unknown" is the normal outcome of not
  // passing a from-tag and an integrator that needs speaker attribution must
  // pass the caller's tag.
  string attribution = 12;
  // Conference members only (INLINE with a group): this member's own state as
  // the control plane holds it — the mirror the member verbs write, not a
  // question asked of the mixing thread. Absent when the session is not
  // seated in a conference on this pod. D22.
  MemberState member = 13;
  // Conference members only: the room this member is seated in, so an
  // integrator can enumerate it from any member without a second RPC.
  ConferenceView conference = 14;
  // When this session opened, on the owner pod's wall clock, so a controller
  // can align its own timeline with MSS's. On a MIX session this is the
  // *conference's* open instant — earlier than the CreateSession that adopted
  // the room if a member opened the conference first — because that is the
  // t=0 every recording of that room is anchored on.
  uint64 opened_at_unix_ms = 15;
}

// One live route of a member's audio inside its conference. A member with no
// route heard elsewhere reports none: its injected audio reaches its own ear
// only and the mixed track does not carry it.
message MemberRoute {
  // "own", "all", or the external id of the member this audio is addressed to.
  string target = 1;
  // "inject" (audio a consumer pushes) or "leg" (the member's own rtp, the
  // coach shape).
  string source = 2;
  // Whether the conference's mixed track — the recording feed — carries it.
  bool monitor_audible = 3;
  // The attachment that asked for this route, empty when nothing owns it.
  string attachment_id = 4;
}

// A conference member's state, read from the control plane's own mirror.
// D22 residual: this state has no lease, so it outlives the controller that
// set it for the life of the conference.
message MemberState {
  bool mute = 1;
  bool deaf = 2;
  bool hold = 3;
  // Where this member's routed audio comes from: "inject" or "leg".
  string mix_source = 4;
  repeated MemberRoute routes = 5;
}

// The room a member is seated in, as this pod holds it. A conference is
// pod-local (D16), so this enumerates the members mixed here.
message ConferenceView {
  string group = 1;
  uint32 member_count = 2;
  repeated string members = 3;
  // The external id of the room session that owns this conference, empty when
  // no CreateSession{kind=MIX} has claimed it. A room recording belongs on
  // that session rather than on a member's (D20).
  string room_session = 4;
}

message SessionRef {
  oneof id {
    string session_id = 1;
    string external_id = 2;
  }
}

// ------------------------------------------------------------- attachments

enum Transport {
  TRANSPORT_UNSPECIFIED = 0;
  TRANSPORT_WS_TWILIO = 1;   // frozen dialect; what consumers speak today
  TRANSPORT_GRPC_STREAM = 2; // MediaStream in mediastream.proto
  TRANSPORT_FILE_S3 = 3;     // recorder; no back channel by construction
  TRANSPORT_RTP_INLINE = 4;  // phase 3/4 participant leg
}

// Capability is an authorization boundary, not bookkeeping (§5.2): a
// recorder must not be able to push audio into a live call, and an
// analytics sink must not be able to emit end_of_interaction and tear a
// session down. Declaring at attach makes those structurally impossible.
enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_SINK = 1;    // receives audio
  CAPABILITY_EVENTS = 2;  // may emit MediaEvents back
  CAPABILITY_INJECT = 3;  // may put audio into the session
}

message TrackSelector {
  oneof select {
    bool all = 1;
    string only = 2;  // "customer" | "agent" | "mixed"
  }
}

message AttachRequest {
  SessionRef session = 1;
  Transport transport = 2;
  repeated Capability capabilities = 3;
  TrackSelector selector = 4;
  AudioFormat format = 5;
  // Exactly one attachment per session may be authoritative (§5.3). Only its
  // events are rendered into the legacy mod_audio_fork::* names that drive
  // the legacy stream fsm; a second authoritative attach is rejected, not resolved.
  bool authoritative = 6;
  string label = 7;
  string endpoint = 8;                // ws url / grpc target / s3 prefix
  map<string, string> metadata = 9;   // audio_fork metadata parity
  string idempotency_key = 10;
  // Joins this attachment to a named group, so the N sessions a conference
  // costs (N SIP dialogs = N rtpengine calls = N MSS sessions, each capped at
  // two legs) can be served as one logical consumer. Empty is exactly the
  // behavior every attachment had before groups existed.
  //
  // For TRANSPORT_FILE_S3 the group is a recording group: each member writes
  // its own mono object under ${accountID}/${recordingID}/${label}.${format}
  // — with .customer/.agent suffixes when a member selects both tracks —
  // while the frozen two-leg identity ${accountID}/${recordingID}.${format}
  // stays exactly what an ungrouped attach produces. One file per participant
  // is deliberate: aligning N sessions' clocks into one N-channel file is a
  // problem per-participant files do not have.
  //
  // A group is keyed (accountID, group) in the owning pod's memory, so v1 is
  // single-pod: every member must attach to the pod that holds the first one,
  // and an adopted session's grouped recording is refused rather than split.
  string group = 11;
}

message Attachment {
  string attachment_id = 1;
  string session_id = 2;
  Transport transport = 3;
  repeated Capability capabilities = 4;
  TrackSelector selector = 5;
  AudioFormat format = 6;
  bool authoritative = 7;
  bool paused = 8;
  string label = 9;
  string group = 10;
}

message AttachmentRef {
  string attachment_id = 1;
}

// Pause/resume is this, not an RPC pair (§5.1).
message UpdateAttachmentRequest {
  string attachment_id = 1;
  optional bool paused = 2;
  TrackSelector selector = 3;
  AudioFormat format = 4;
  string idempotency_key = 5;
  // Merged into the attachment's metadata: present keys are overwritten,
  // absent keys are left alone. This is how a metadata-carried verb changes
  // mid-stream without a new RPC — today that verb is mix_target, which flips
  // a whisper into a barge (docs/tasks.md item 38, and implementation-notes
  // "conference.rs — monitor, whisper and barge").
  map<string, string> metadata = 6;
}

// send_text parity: forwarded verbatim to the far end, which is why the
// transport must have a back channel.
message SendToAttachmentRequest {
  string attachment_id = 1;
  string json = 2;
}

// --------------------------------------------------------------- playback

message StartPlaybackRequest {
  SessionRef session = 1;
  oneof source {
    bytes blob = 2;   // raw bytes; rtpengine rejects blob64 (lab-measured)
    string file = 3;
    bool stream = 4;  // phase 3: streaming TTS
  }
  // Empty means everyone in the session hears it; a from-tag targets one
  // participant, which is the whisper shape (lab-measured on 14.1.1.8).
  // On an inline leg there is no from-tag: empty or "own" is that leg's own
  // ear, and "all" plays the prompt into the conference the leg is seated in,
  // where every member and the mixed track hear it.
  string target_tag = 5;
  uint32 repeat_times = 6;
  bool block_egress = 7;
  // When set, the playback is attributed to that attachment and requires
  // its INJECT capability.
  string requested_by = 8;
  string idempotency_key = 9;
}

message Playback {
  string playback_id = 1;
  string session_id = 2;
}

message PlaybackRef {
  string playback_id = 1;
}

// ----------------------------------------------------------------- events

message WatchRequest {
  SessionRef session = 1;
}

// Published to Kafka topic "mss.events", keyed by external_id, sequence
// numbered per session, OTel context injected. In a deployment with a legacy
// event consumer, a small translator owned by that consumer renders these
// onto its existing topic in whatever format it already parses (in the
// reference deployment: a positional Events{repeated string} list).
//
// The translator lives with the legacy consumer, not in MSS: the legacy
// format IS that consumer's constant table. Encoding it here would couple
// MSS to a file that changes without our knowing, and the day someone
// inserts an index MSS silently corrupts every event.
//
// Legacy names it renders (only when legacy_eligible is set):
//   speech_started      -> mod_audio_fork::start_of_transcript
//   partial             -> mod_audio_fork::partial_speech_result
//   final (first_final) -> mod_audio_fork::first_transcript
//   final               -> mod_audio_fork::transcription
//   end_of_utterance    -> mod_audio_fork::end_of_utterance
//   end_of_interaction  -> mod_audio_fork::end_of_interaction
//   playback_started    -> mod_audio_fork::play_audio
message MediaEvent {
  string session_id = 1;
  string external_id = 2;
  string attachment_id = 3;
  uint64 seq = 4;
  google.protobuf.Timestamp at = 5;
  // False for every non-authoritative attachment: the event still reaches
  // mss.events for analytics and debugging, but must never drive the legacy stream fsm.
  bool legacy_eligible = 6;
  // Which kind of session emitted this: a consumer of mss.events can tell a
  // tap's events from an inline leg's without asking the API.
  SessionKind session_kind = 7;
  // How the track names in this event's payload were arrived at: "explicit",
  // "inferred" or "unknown" (D17). Under "unknown" the tracks are named leg_a
  // and leg_b and no event claims a direction.
  string attribution = 8;

  oneof payload {
    SpeechStarted speech_started = 10;
    PartialTranscript partial = 11;
    FinalTranscript final = 12;
    EndOfUtterance end_of_utterance = 13;
    Dtmf dtmf = 14;
    PlaybackStarted playback_started = 15;
    PlaybackStopped playback_stopped = 16;
    RecordingStarted recording_started = 17;
    RecordingStopped recording_stopped = 18;
    UploadCompleted upload_completed = 19;
    AttachmentUp attachment_up = 20;
    AttachmentDown attachment_down = 21;
    SessionEnded session_ended = 22;
    EndOfInteraction end_of_interaction = 23;
    RecordingPaused recording_paused = 24;
    MixRouted mix_routed = 25;
    MemberControlled member_controlled = 26;
    LegsAttributed legs_attributed = 27;
    UploadFailed upload_failed = 28;
  }
}

message SpeechStarted { string track = 1; }

// The highest-rate event in the system, and the one the barge-in budget is
// measured against (§5.5).
message PartialTranscript {
  string track = 1;
  string text = 2;
  double confidence = 3;
}

message FinalTranscript {
  string track = 1;
  string text = 2;
  double confidence = 3;
  // MSS owns the session, so MSS knows which final is the first one; the
  // translator does not have to keep that state.
  bool first_final = 4;
}

message EndOfUtterance { string track = 1; }
// One press, published as soon as the RFC 4733 end packet arrives, whether or
// not any consumer is attached: digits belong to the call, not to a consumer.
// The three retransmissions of that end packet are one event. duration_ms is
// the press length the endpoint reported, converted through the negotiated RTP
// clock rate; rtp_timestamp is the event's start timestamp on that same clock,
// so digits can be lined up with recorded audio.
message Dtmf {
  string track = 1;
  string digit = 2;
  uint32 duration_ms = 3;
  uint32 rtp_timestamp = 4;
}
message PlaybackStarted { string playback_id = 1; }
message PlaybackStopped { string playback_id = 1; string reason = 2; }
message RecordingStarted { string recording_id = 1; string path = 2; string shape = 3; }
// The frozen recording callback contract is recordStart / recordPause /
// recordStop / uploadCompleted, and pause means "cut a segment, defer the
// upload, keep accumulating duration". duration_ms is therefore the audio
// recorded so far, never wall-clock since recordStart, and it is reported on
// both edges: paused=true when the segment is cut, paused=false when the next
// one opens.
message RecordingPaused { string recording_id = 1; bool paused = 2; uint64 duration_ms = 3; }
message RecordingStopped { string recording_id = 1; uint64 duration_ms = 2; }
message UploadCompleted { string recording_id = 1; string uri = 2; }
// The terminal event of a recording that never reached storage (D11). It is
// published after the detach that stopped the recording has already been
// answered, and it is the last event of that session's sequence: the audio is
// on this pod's spill disk, waiting for the salvage pass on its next start.
message UploadFailed { string recording_id = 1; string key = 2; string error = 3; }
message AttachmentUp { string label = 1; }
// Emitted once per session when MSS settles who is who, so an integrator can
// audit speaker attribution instead of trusting it. attribution is "explicit",
// "inferred" or "unknown"; tracks are the names this session's gRPC frames and
// recording objects carry (leg_a / leg_b when unknown). The frozen WS Twilio
// dialect keeps inbound / outbound whatever this says, so a WS consumer's only
// warning that its track names are a guess is this event.
message LegsAttributed { string attribution = 1; repeated string tracks = 2; }
// Where an INJECT attachment's audio lands in its conference's mix: "own" is
// private playback into its own leg (the default), a member's external id is a
// whisper heard only by that member, "all" is the barge flip. monitor_audible
// says whether the conference's mixed track — the monitor and recording feed —
// carries it, so an integrator can audit who whispered to whom.
message MixRouted { string mix_target = 1; bool monitor_audible = 2; }
// A conference member's own routing verbs: mute silences their contributor row,
// deaf silences the room into their ear, hold is both. Member state outlives
// the attachment that carried the verb.
message MemberControlled { bool mute = 1; bool deaf = 2; bool hold = 3; }
message AttachmentDown { string label = 1; string reason = 2; }
message SessionEnded { string reason = 1; }
message EndOfInteraction { string reason = 1; }

// ----------------------------------------------------------------- shared

message AudioFormat {
  Encoding encoding = 1;
  uint32 sample_rate_hz = 2;
  uint32 channels = 3;
  uint32 ptime_ms = 4;
}

enum Encoding {
  ENCODING_UNSPECIFIED = 0;
  ENCODING_PCMU = 1;
  ENCODING_PCMA = 2;
  ENCODING_L16 = 3;
  ENCODING_OPUS = 4;
}

message Ack {}
