// MSS data plane — what actually flows on a gRPC attachment
// (docs/architecture.md §5.8).
//
// Control lives in mediacontrol.proto and says who may attach and with what
// capability; this file says what bytes move once they have. Binary frames
// over HTTP/2 remove the per-packet JSON+base64 overhead the WS-Twilio
// dialect carries (50 marshals+encodes/sec/call; at 1,000 calls that is 50k
// per second of pure serialization). The WS adapter keeps that cost
// deliberately — it is the compatibility surface, not the native one.
//
// Field numbers are provisional until first release, frozen after
// (Constitution, Article VII).

syntax = "proto3";

package mss.v1;

import "mediacontrol.proto";
import "google/protobuf/timestamp.proto";

service MediaStream {
  rpc Subscribe(stream ConsumerToServer) returns (stream ServerToConsumer);
}

message ServerToConsumer {
  oneof msg {
    StreamStart start = 1;
    AudioFrame frame = 2;
    DtmfFrame dtmf = 3;
    TextFrame text = 4;
    StreamStop stop = 5;
  }
}

message ConsumerToServer {
  oneof msg {
    ConsumerHello hello = 1;
    // Honored only when the attachment declared CAPABILITY_INJECT; from any
    // other attachment this is a protocol violation, not a no-op (§5.2).
    AudioFrame inject = 2;
    Mark mark = 3;
    Clear clear = 4;
    // Honored only when the attachment declared CAPABILITY_EVENTS; from any
    // other attachment this is a protocol violation, not a no-op. This is
    // the only wire on which a consumer can say "the human started talking"
    // -- the WS-Twilio dialect has no such message and never will, its bytes
    // being frozen (Constitution, Article VII), so a WS consumer cannot
    // report speech and cannot drive barge-in.
    SpeechReport report = 5;
  }
}

message ConsumerHello {
  string attachment_id = 1;
  string token = 2;
  // MSS re-encodes per consumer, so a consumer asks for what it wants
  // rather than adapting to whatever the call happens to use.
  AudioFormat requested_format = 3;
}

message StreamStart {
  string session_id = 1;
  string external_id = 2;
  string attachment_id = 3;
  string stream_sid = 4;
  repeated string tracks = 5;
  AudioFormat format = 6;
  map<string, string> custom_parameters = 7;
}

message AudioFrame {
  string track = 1;
  uint64 seq = 2;
  uint64 pts_ms = 3;
  // Raw audio in the attachment's declared format, NOT base64.
  // L16 payloads are little-endian signed 16-bit mono (the "linear16"
  // most ASR vendors consume), not the network-order RTP L16.
  bytes payload = 4;
}

message DtmfFrame {
  string track = 1;
  string digit = 2;
}

// send_text passthrough, in the fork_events shapes.
message TextFrame {
  string json = 1;
}

// What a consumer observed in the audio MSS handed it. MSS turns one of
// these into the matching MediaEvent (SpeechStarted / PartialTranscript /
// FinalTranscript / EndOfUtterance / EndOfInteraction) and publishes it on
// the event bus, where a translator can act on it -- the first hop of
// barge-in cut-through.
message SpeechReport {
  SpeechReportKind kind = 1;
  // "customer" | "agent" | "mixed"; required for every kind but
  // END_OF_INTERACTION, which is about the interaction, not a track.
  string track = 2;
  // Carried by PARTIAL and FINAL; ignored otherwise.
  string text = 3;
  double confidence = 4;
  // When the consumer itself observed this, on the consumer's clock. MSS
  // stamps the published MediaEvent on its own clock instead of trusting
  // this one; it is carried so the consumer's detection lag is visible.
  google.protobuf.Timestamp observed_at = 5;
  // Carried by END_OF_INTERACTION only.
  string reason = 6;
}

enum SpeechReportKind {
  SPEECH_REPORT_KIND_UNSPECIFIED = 0;
  SPEECH_REPORT_KIND_STARTED = 1;
  SPEECH_REPORT_KIND_PARTIAL = 2;
  SPEECH_REPORT_KIND_FINAL = 3;
  SPEECH_REPORT_KIND_END_OF_UTTERANCE = 4;
  SPEECH_REPORT_KIND_END_OF_INTERACTION = 5;
}

message Mark {
  string name = 1;
}

message Clear {}

message StreamStop {
  string reason = 1;
}
