// MSS data plane — what actually flows on a gRPC attachment
// (docs/architecture.md §5.8).
//
// Control lives in mediacontrol.proto and says who may attach and with what
// capability; this file says what bytes move once they have. Binary frames
// over HTTP/2 remove the per-packet JSON+base64 overhead the WS-Twilio
// dialect carries (50 marshals+encodes/sec/call; at 1,000 calls that is 50k
// per second of pure serialization). The WS adapter keeps that cost
// deliberately — it is the compatibility surface, not the native one.
//
// Field numbers are provisional until first release, frozen after
// (Constitution, Article VII).

syntax = "proto3";

package mss.v1;

import "mediacontrol.proto";

service MediaStream {
  rpc Subscribe(stream ConsumerToServer) returns (stream ServerToConsumer);
}

message ServerToConsumer {
  oneof msg {
    StreamStart start = 1;
    AudioFrame frame = 2;
    DtmfFrame dtmf = 3;
    TextFrame text = 4;
    StreamStop stop = 5;
  }
}

message ConsumerToServer {
  oneof msg {
    ConsumerHello hello = 1;
    // Honored only when the attachment declared CAPABILITY_INJECT; from any
    // other attachment this is a protocol violation, not a no-op (§5.2).
    AudioFrame inject = 2;
    Mark mark = 3;
    Clear clear = 4;
  }
}

message ConsumerHello {
  string attachment_id = 1;
  string token = 2;
  // MSS re-encodes per consumer, so a consumer asks for what it wants
  // rather than adapting to whatever the call happens to use.
  AudioFormat requested_format = 3;
}

message StreamStart {
  string session_id = 1;
  string external_id = 2;
  string attachment_id = 3;
  string stream_sid = 4;
  repeated string tracks = 5;
  AudioFormat format = 6;
  map<string, string> custom_parameters = 7;
}

message AudioFrame {
  string track = 1;
  uint64 seq = 2;
  uint64 pts_ms = 3;
  // Raw audio in the attachment's declared format, NOT base64.
  // L16 payloads are little-endian signed 16-bit mono (the "linear16"
  // most ASR vendors consume), not the network-order RTP L16.
  bytes payload = 4;
}

message DtmfFrame {
  string track = 1;
  string digit = 2;
}

// send_text passthrough, in the fork_events shapes.
message TextFrame {
  string json = 1;
}

message Mark {
  string name = 1;
}

message Clear {}

message StreamStop {
  string reason = 1;
}
