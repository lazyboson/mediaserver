// MSS gRPC contracts — wired with tonic/prost in milestone M4.
// Sketch from docs/architecture.md §5.1; field numbers are provisional
// until first release, frozen after.

syntax = "proto3";

package mss.v1;

service MediaControl {
  rpc StartTap(StartTapRequest) returns (StartTapResponse);
  rpc StopTap(StopTapRequest) returns (Ack);
  rpc AddConsumer(AddConsumerRequest) returns (AddConsumerResponse);
  rpc RemoveConsumer(ConsumerRef) returns (Ack);
  rpc PauseConsumer(ConsumerRef) returns (Ack);   // the legacy stream fsm parity
  rpc ResumeConsumer(ConsumerRef) returns (Ack);  // the legacy stream fsm parity
  rpc SendText(SendTextRequest) returns (Ack);    // audio_fork send_text parity
}

service MediaStream {
  // Consumer attaches and receives frames; client messages carry control
  // and (phase 3, inline sessions) injected audio.
  rpc Subscribe(stream ConsumerToServer) returns (stream ServerToConsumer);
}

message StartTapRequest {
  string session_id = 1;       // MSS session (usually = interaction id)
  string call_id = 2;          // SIP Call-ID at the anchoring rtpengine
  repeated string from_tags = 3;
  string rtpengine_node = 4;   // discovered via call->node registry
  bool mix = 5;
  repeated ConsumerSpec consumers = 6;
}

message StartTapResponse {
  string session_id = 1;
  string owner_pod = 2;
}

message StopTapRequest { string session_id = 1; }

message ConsumerSpec {
  string consumer_id = 1;
  oneof endpoint {
    string ws_url = 2;         // Twilio-dialect WebSocket (compat mode)
    string grpc_target = 3;    // MSS dials out (push mode)
  }
  AudioFormat format = 4;
  map<string, string> metadata = 5;  // audio_fork metadata parity
}

message AddConsumerRequest {
  string session_id = 1;
  ConsumerSpec consumer = 2;
}

message AddConsumerResponse { string consumer_id = 1; }

message ConsumerRef {
  string session_id = 1;
  string consumer_id = 2;
}

message SendTextRequest {
  string session_id = 1;
  string consumer_id = 2;
  string json = 3;             // forwarded verbatim (fork_events shapes)
}

message Ack {}

message AudioFormat {
  Encoding encoding = 1;
  uint32 sample_rate_hz = 2;
  uint32 channels = 3;
  uint32 ptime_ms = 4;
}

enum Encoding {
  ENCODING_UNSPECIFIED = 0;
  ENCODING_PCMU = 1;
  ENCODING_PCMA = 2;
  ENCODING_L16 = 3;
  ENCODING_OPUS = 4;
}

message ServerToConsumer {
  oneof msg {
    StreamStart start = 1;
    AudioFrame frame = 2;
    DtmfEvent dtmf = 3;
    TextEvent text = 4;
    StreamStop stop = 5;
  }
}

message ConsumerToServer {
  oneof msg {
    ConsumerHello hello = 1;
    AudioFrame inject = 2;     // phase 3, inline sessions only
    Mark mark = 3;
    Clear clear = 4;
  }
}

message StreamStart {
  string session_id = 1;
  string stream_sid = 2;
  repeated string tracks = 3;
  AudioFormat format = 4;
  map<string, string> custom_parameters = 5;
}

message AudioFrame {
  string track = 1;
  uint64 seq = 2;
  uint64 pts_ms = 3;
  bytes payload = 4;           // raw audio, NOT base64
}

message DtmfEvent {
  string track = 1;
  string digit = 2;
}

message TextEvent { string json = 1; }

message Mark { string name = 1; }
message Clear {}

message StreamStop {
  string reason = 1;
}
