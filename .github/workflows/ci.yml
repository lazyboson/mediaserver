name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  guidelines:
    name: No-comments policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail if any Rust source contains a comment
        run: |
          if grep -rn '//' crates --include='*.rs'; then
            echo '::error::Comments are forbidden in Rust sources (docs/rust-guidelines.md §1)'
            exit 1
          fi
          if grep -rn '/\*' crates --include='*.rs'; then
            echo '::error::Block comments are forbidden in Rust sources (docs/rust-guidelines.md §1)'
            exit 1
          fi

  lint:
    name: Format & clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  build:
    name: Release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      - uses: actions/upload-artifact@v7
        with:
          name: mediaserverd-${{ github.sha }}
          path: target/release/mediaserverd
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          tags: mediaserverd:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deny:
    name: Licenses & advisories (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all
