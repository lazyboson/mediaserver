name: CI

# Runs on the self-hosted Apple-silicon Mac (see ~/actions-runner-runner-pool/README.md).
# Trade-off: PR CI compiles and tests on macOS/aarch64, not linux/amd64.
# The shipping gate stays the linux/arm64 image build in image-main.yml/release.yml.
# The build needs cmake, make and a C++ compiler on the host for opus-ffi.

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
    inputs:
      runner:
        description: Runner pool (ubuntu-latest is the emergency fallback)
        default: self-hosted
        type: choice
        options: [self-hosted, ubuntu-latest]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_BUILD_JOBS: 4
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 3
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  guidelines:
    name: No-comments policy
    runs-on: ${{ inputs.runner == 'ubuntu-latest' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","macOS","ARM64","runner-pool"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Fail if any Rust source contains a comment
        run: |
          if grep -rn '//' crates --include='*.rs'; then
            echo '::error::Comments are forbidden in Rust sources (docs/rust-guidelines.md §1)'
            exit 1
          fi
          if grep -rn '/\*' crates --include='*.rs'; then
            echo '::error::Block comments are forbidden in Rust sources (docs/rust-guidelines.md §1)'
            exit 1
          fi

  lint:
    name: Format & clippy
    runs-on: ${{ inputs.runner == 'ubuntu-latest' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","macOS","ARM64","runner-pool"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: build environment
        run: |
          echo "CARGO_TARGET_DIR=$HOME/actions-runner-runner-pool/cache/target" >> "$GITHUB_ENV"
          LOCK="$HOME/actions-runner-runner-pool/with-lock.sh"
          [ -x "$LOCK" ] || LOCK=""
          echo "LOCK=$LOCK" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - run: $LOCK cargo fmt --all --check
      - run: $LOCK cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ${{ inputs.runner == 'ubuntu-latest' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","macOS","ARM64","runner-pool"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: build environment
        run: |
          echo "CARGO_TARGET_DIR=$HOME/actions-runner-runner-pool/cache/target" >> "$GITHUB_ENV"
          LOCK="$HOME/actions-runner-runner-pool/with-lock.sh"
          [ -x "$LOCK" ] || LOCK=""
          echo "LOCK=$LOCK" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: $LOCK cargo test --workspace

  build:
    name: Release build
    runs-on: ${{ inputs.runner == 'ubuntu-latest' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","macOS","ARM64","runner-pool"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: build environment
        run: |
          echo "CARGO_TARGET_DIR=$HOME/actions-runner-runner-pool/cache/target" >> "$GITHUB_ENV"
          LOCK="$HOME/actions-runner-runner-pool/with-lock.sh"
          [ -x "$LOCK" ] || LOCK=""
          echo "LOCK=$LOCK" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: $LOCK cargo build --workspace --release
      - uses: actions/upload-artifact@v7
        with:
          name: mediaserverd-${{ github.sha }}
          path: ${{ env.CARGO_TARGET_DIR }}/release/mediaserverd
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ${{ inputs.runner == 'ubuntu-latest' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","macOS","ARM64","runner-pool"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: build image
        run: |
          LOCK="$HOME/actions-runner-runner-pool/with-lock.sh"
          [ -x "$LOCK" ] || LOCK=""
          $LOCK docker buildx build --platform linux/arm64 --tag mediaserverd:ci --load .

  deny:
    name: Licenses & advisories (cargo-deny)
    runs-on: ${{ inputs.runner == 'ubuntu-latest' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","macOS","ARM64","runner-pool"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # cargo-deny-action is a Docker container action and cannot run on a
      # macOS runner; the binary is installed on the host instead.
      - run: cargo deny check all
