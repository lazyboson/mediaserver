name: CI

# Runs on GitHub-hosted runners. PR CI compiles and tests on linux/amd64;
# the shipping gate stays the linux/arm64 image build in image-main.yml/release.yml.
# The build needs cmake, make and a C++ compiler on the host for opus-ffi
# (present on ubuntu-latest).

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 3
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  guidelines:
    name: No-comments policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Fail if any Rust source contains a comment
        run: |
          if grep -rn '//' crates --include='*.rs'; then
            echo '::error::Comments are forbidden in Rust sources (docs/rust-guidelines.md §1)'
            exit 1
          fi
          if grep -rn '/\*' crates --include='*.rs'; then
            echo '::error::Block comments are forbidden in Rust sources (docs/rust-guidelines.md §1)'
            exit 1
          fi

  lint:
    name: Format & clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  build:
    name: Release build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      - uses: actions/upload-artifact@v7
        with:
          name: mediaserverd-${{ github.sha }}
          path: target/release/mediaserverd
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: build image
        run: docker buildx build --platform linux/arm64 --tag mediaserverd:ci --load .

  deny:
    name: Licenses & advisories (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all
