name: image-main

# Image build runs on the self-hosted Apple-silicon Mac and is the linux/arm64
# shipping gate. Push events only, never pull requests.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner pool (ubuntu-latest is the emergency fallback)
        default: self-hosted
        type: choice
        options: [self-hosted, ubuntu-latest]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ${{ inputs.runner == 'ubuntu-latest' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","macOS","ARM64","runner-pool"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: docker environment
        run: |
          D="$HOME/actions-runner-runner-pool/docker"
          [ -d "$D" ] && echo "DOCKER_CONFIG=$D" >> "$GITHUB_ENV" || true
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push image
        run: |
          LOCK="$HOME/actions-runner-runner-pool/with-lock.sh"
          [ -x "$LOCK" ] || LOCK=""
          $LOCK docker buildx build --platform linux/arm64 --push \
            --tag ghcr.io/${{ github.repository }}:latest \
            --tag ghcr.io/${{ github.repository }}:${{ github.sha }} .
