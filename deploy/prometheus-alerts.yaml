# Alert rules over the counters mediaserverd exports on MSS_METRICS_LISTEN.
# Every silent-drop counter gets an alert (Constitution, Article VIII: a drop
# is a first-class metric, never a silence). Thresholds are starting points
# for the Phase-1 pilot; tune them against the lab baseline before GA.

groups:
  - name: mss-drops
    rules:
      - alert: MssConsumerFramesDropped
        expr: rate(mss_consumer_dropped_oldest_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "A slow consumer is losing tap audio"
          description: >-
            {{ $labels.instance }} is dropping the oldest frames from at least
            one consumer queue. The consumer cannot keep up with the call; its
            transcript or recording has gaps.

      - alert: MssEventQueueDropping
        expr: rate(mss_events_dropped_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MediaEvents are being dropped before reaching Kafka"
          description: >-
            The event pump queue on {{ $labels.instance }} is full. the legacy stream fsm
            decisions downstream are running on an incomplete event stream;
            the per-session gapless seq lets consumers see the holes.

      - alert: MssEventPublishFailing
        expr: rate(mss_events_failed_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "The Kafka broker is refusing MediaEvents"
          description: >-
            Failed publish attempts are retried from the pump backlog, so a
            short blip costs nothing but latency. Sustained failure fills the
            backlog and then loses the oldest events; check broker health
            before mss_events_dropped_oldest_total starts moving.

      - alert: MssEventBacklogDroppingOldest
        expr: rate(mss_events_dropped_oldest_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "The event retry backlog is full and losing its oldest events"
          description: >-
            The broker has been unreachable long enough to fill the pump
            backlog on {{ $labels.instance }}. Events are now lost, oldest
            first; downstream sees holes in the per-session seq.

      - alert: MssEventBacklogDeep
        expr: mss_events_retry_depth > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MediaEvents have been waiting to publish for five minutes"
          description: >-
            The pump is retrying and not draining. Events are still safe in
            memory, but they are late — and a pod restart would lose them.

      - alert: MssEventsAbandoned
        expr: increase(mss_events_abandoned_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "A pump shut down with unsent MediaEvents"
          description: >-
            mediaserverd stopped while the bus was still refusing events, so
            the backlog was discarded. Expect seq holes for the sessions that
            were live at shutdown.

      - alert: MssRegistryOutboxDropping
        expr: rate(mss_events_outbox_dropped_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "The registry outbox overflowed before any sink saw events"
          description: >-
            The controller is producing events faster than they are drained.
            This should be unreachable in normal operation; treat as a bug.

  - name: mss-media-quality
    rules:
      - alert: MssTapLegStalled
        expr: mss_legs_stalled > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "A live tap leg has stopped receiving RTP"
          description: >-
            The audio-flow watchdog on {{ $labels.instance }} reports a leg
            with no datagrams for the stall window. A held or
            silence-suppressed caller can trip this briefly; a stall that
            holds for minutes means the subscription or routing broke.

      - alert: MssLegSpeakerUnresolved
        expr: mss_legs_unknown_ssrc > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "A tap leg's speaker could not be named from rtpengine's ssrcs"
          description: >-
            A mid-call ssrc change (re-INVITE, transfer, codec renegotiation)
            normally clears within one re-resolution cycle — compare
            mss_legs_ssrc_changes_total, mss_ssrc_requeries_total and
            mss_legs_ssrc_reresolved_total. A leg that stays unresolved for
            minutes is labelled by elimination or by stream order, so
            recordings and transcripts of that call may name the wrong
            speaker.

      - alert: MssJitterLossHigh
        expr: >-
          rate(mss_jitter_lost_total[5m])
            / clamp_min(rate(mss_ingest_datagrams_total[5m]), 1) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of tap packets are being lost"
          description: >-
            Sustained loss at this level is audible and degrades ASR accuracy.
            Compare against rtpengine-side counters to localize the hop.

  - name: mss-registry
    rules:
      - alert: MssLeaseLost
        expr: increase(mss_registry_lost_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "A session lease moved to another pod while this one was alive"
          description: >-
            Two pods may believe they own one session (split brain). Check
            Redis reachability and lease TTL versus renew cadence.

      - alert: MssRegistryFailing
        expr: rate(mss_registry_failed_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Session registry operations are failing"
          description: >-
            Persist or renew calls against Redis are erroring; sessions on
            this pod may not be recoverable after a pod loss.

  - name: mss-recording
    rules:
      - alert: MssRecordingUploadsFailing
        expr: increase(mss_recording_upload_failures_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "A recording did not reach object storage"
          description: >-
            The recorder closed a call and the upload failed. If
            MSS_RECORDING_SPILL_DIR is set the audio is on the pod's disk
            under the recording identity and can be uploaded by hand; if it
            is not, that recording is gone. Check bucket credentials,
            endpoint reachability and mss_recording_spills_total.

      - alert: MssRecordingsSpilled
        expr: increase(mss_recording_spills_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Recordings are being kept on local pod disk"
          description: >-
            Every spilled file is an upload that failed and a recording a
            downstream consumer cannot see yet. A pod restart loses them.

      - alert: MssRecordingsTruncated
        expr: increase(mss_recordings_truncated_total[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "A recording hit its length cap and lost its tail"
          description: >-
            The recorder buffers the whole call in memory and stops at its
            cap (2 h of audio). Calls longer than that need the streaming
            multipart upload that is not built yet.
