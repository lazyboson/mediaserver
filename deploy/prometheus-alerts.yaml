# Alert rules over the counters mediaserverd exports on MSS_METRICS_LISTEN.
# Every silent-drop counter gets an alert (Constitution, Article VIII: a drop
# is a first-class metric, never a silence). Thresholds are starting points
# for the Phase-1 pilot; tune them against the lab baseline before GA.

groups:
  - name: mss-drops
    rules:
      - alert: MssConsumerFramesDropped
        expr: rate(mss_consumer_dropped_oldest_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "A slow consumer is losing tap audio"
          description: >-
            {{ $labels.instance }} is dropping the oldest frames from at least
            one consumer queue. The consumer cannot keep up with the call; its
            transcript or recording has gaps.

      - alert: MssEventQueueDropping
        expr: rate(mss_events_dropped_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MediaEvents are being dropped before reaching Kafka"
          description: >-
            The event pump queue on {{ $labels.instance }} is full. Legacy stream
            state machine decisions downstream are running on an incomplete event stream;
            the per-session gapless seq lets consumers see the holes.

      - alert: MssEventPublishFailing
        expr: rate(mss_events_failed_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "The Kafka broker is refusing MediaEvents"
          description: >-
            Failed publish attempts are retried from the pump backlog, so a
            short blip costs nothing but latency. Sustained failure fills the
            backlog and then loses the oldest events; check broker health
            before mss_events_dropped_oldest_total starts moving.

      - alert: MssEventBacklogDroppingOldest
        expr: rate(mss_events_dropped_oldest_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "The event retry backlog is full and losing its oldest events"
          description: >-
            The broker has been unreachable long enough to fill the pump
            backlog on {{ $labels.instance }}. Events are now lost, oldest
            first; downstream sees holes in the per-session seq.

      - alert: MssEventBacklogDeep
        expr: mss_events_retry_depth > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MediaEvents have been waiting to publish for five minutes"
          description: >-
            The pump is retrying and not draining. Events are still safe in
            memory, but they are late — and a pod restart would lose them.

      - alert: MssEventsAbandoned
        expr: increase(mss_events_abandoned_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "A pump shut down with unsent MediaEvents"
          description: >-
            mediaserverd stopped while the bus was still refusing events, so
            the backlog was discarded. Expect seq holes for the sessions that
            were live at shutdown.

      - alert: MssRegistryOutboxDropping
        expr: rate(mss_events_outbox_dropped_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "The registry outbox overflowed before any sink saw events"
          description: >-
            The controller is producing events faster than they are drained.
            This should be unreachable in normal operation; treat as a bug.

      - alert: MssDtmfEventsDropping
        expr: rate(mss_dtmf_events_dropped_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "DTMF presses are being dropped before reaching the event bus"
          description: >-
            The DTMF event queue on {{ $labels.instance }} is full. Consumers
            still receive the digits in-band, but mss.events is missing
            presses, so anything driven off the bus sees an incomplete entry.

      - alert: MssInlineEgressDropping
        expr: rate(mss_inline_egress_dropped_samples_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "An inline leg is dropping outbound audio"
          description: >-
            {{ $labels.instance }} is dropping the oldest samples from at least
            one inline egress ring. The producer is feeding audio faster than
            the leg plays it; the peer hears gaps in the prompt or bot speech.

      - alert: MssConferenceFramesRefused
        expr: rate(mss_conference_frames_refused_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "A conference mix is refusing member frames"
          description: >-
            {{ $labels.instance }}'s mix matrix refused frames, for frame size
            or a stale membership handle. That member's audio is missing from
            the mix while this fires.

      - alert: MssInlineEgressRefusing
        expr: rate(mss_inline_egress_chunks_refused_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "An inline leg is refusing inbound audio chunks"
          description: >-
            {{ $labels.instance }} could not queue audio chunks because an
            inline egress queue was full. The producer's audio is being
            discarded before it reaches the leg; the peer hears gaps.

      - alert: MssRecordingFramesLostOnAdopt
        expr: rate(mss_recording_frames_lost_on_adopt_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "An adopted recording lost frames from the dead pod"
          description: >-
            {{ $labels.instance }} adopted a recording from a dead pod but
            could not read back all the frames that pod held. The affected
            recording has a gap; check the spill volume and the dead pod's
            disk.

  - name: mss-media-quality
    rules:
      - alert: MssTapLegStalled
        expr: mss_legs_stalled > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "A live tap leg has stopped receiving RTP"
          description: >-
            The audio-flow watchdog on {{ $labels.instance }} reports a leg
            with no datagrams for the stall window. A held or
            silence-suppressed caller can trip this briefly; a stall that
            holds for minutes means the subscription or routing broke.

      - alert: MssLegSpeakerUnresolved
        expr: mss_legs_unknown_ssrc > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "A tap leg's speaker could not be named from rtpengine's ssrcs"
          description: >-
            A mid-call ssrc change (re-INVITE, transfer, codec renegotiation)
            normally clears within one re-resolution cycle — compare
            mss_legs_ssrc_changes_total, mss_ssrc_requeries_total and
            mss_legs_ssrc_reresolved_total. A leg that stays unresolved for
            minutes is labelled by elimination or by stream order, so
            recordings and transcripts of that call may name the wrong
            speaker.

      - alert: MssJitterLossHigh
        expr: >-
          rate(mss_jitter_lost_total[5m])
            / clamp_min(rate(mss_ingest_datagrams_total[5m]), 1) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of tap packets are being lost"
          description: >-
            Sustained loss at this level is audible and degrades ASR accuracy.
            Compare against rtpengine-side counters to localize the hop.

      - alert: MssJitterLateDropsHigh
        expr: >-
          rate(mss_jitter_late_drops_total[5m])
            / clamp_min(rate(mss_ingest_datagrams_total[5m]), 1) > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 1% of tap packets arrive too late to play"
          description: >-
            Packets are reaching the jitter buffer after their playout slot
            and are discarded, which is audible like loss but is not counted
            as loss. Delay variation on the tap link exceeds the buffer depth.

  - name: mss-registry
    rules:
      - alert: MssLeaseLost
        expr: increase(mss_registry_lost_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "A session lease moved to another pod while this one was alive"
          description: >-
            This pod gave the session up (mss_registry_surrendered_total) so the
            call is not tapped twice. Check Redis reachability and lease TTL
            versus renew cadence.

      - alert: MssOrphanedTapLeft
        expr: increase(mss_registry_orphans_still_subscribed_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "An adopted session left the previous owner's rtpengine tap in place"
          description: >-
            rtpengine keeps copying that call to a pod that is gone until the
            call ends, doubling its cost on the media node. Either the record
            carried no subscription to-tag or the unsubscribe was refused;
            check the adopting pod's logs for the call-id.

      - alert: MssRegistryFailing
        expr: rate(mss_registry_failed_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Session registry operations are failing"
          description: >-
            Persist or renew calls against Redis are erroring; sessions on
            this pod may not be recoverable after a pod loss.

  - name: mss-recording
    rules:
      - alert: MssRecordingUploadsFailing
        expr: increase(mss_recording_upload_failures_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "A recording did not reach object storage"
          description: >-
            The recorder closed a call and the upload failed. If
            MSS_RECORDING_SPILL_DIR is set the audio is on the pod's disk
            under the recording identity and can be uploaded by hand; if it
            is not, that recording is gone. Check bucket credentials,
            endpoint reachability and mss_recording_spills_total.

      - alert: MssRecordingsSpilled
        expr: increase(mss_recording_spills_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Recordings are being kept on local pod disk"
          description: >-
            Every spilled file is an upload that failed and a recording a
            downstream consumer cannot see yet. A pod restart loses them.

      - alert: MssRecordingsTruncated
        expr: increase(mss_recordings_truncated_total[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "A recording hit its length cap and lost its tail"
          description: >-
            The recorder buffers the whole call in memory and stops at its
            cap (2 h of audio). Calls longer than that need the streaming
            multipart upload that is not built yet.

  - name: mss-rtpengine
    rules:
      - alert: MssTapsFellOutOfKernel
        expr: >-
          max by (instance, node) (mss_rtpengine_tap_kernel_verdict{verdict="TranscodedTapsAreProcessedInUserspace"}) > 0
          or
          (
            delta(mss_rtpengine_media_userspace[10m]) > 0
            and delta(mss_rtpengine_media_kernel[10m]) == 0
          )
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "rtpengine is carrying MSS taps in userspace, not the kernel module"
          description: >-
            Either this daemon asks rtpengine to transcode the tap (the
            verdict label says so, and a transcoded subscription is always a
            userspace subscription), or node {{ $labels.node }} is growing
            userspace media streams while its kernel media stays flat. Both
            mean the rtpengine host pays the full per-tap copy cost, which is
            the number the capacity plan is built on. Walk the read-only
            checklist in docs/architecture.md section 8.1 (and
            lab/kernel_probe.sh) on that host: compare
            mss_rtpengine_relayed_packets_kernel against
            mss_rtpengine_relayed_packets_user across baseline,
            taps-with-transcode and taps-without-transcode. Consider
            MSS_TAP_TRANSCODE=off if the consumers can take the native codec.
