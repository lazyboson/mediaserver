# ############################################################################
# #  TEMPLATE ONLY -- EVERY VALUE BELOW IS A PLACEHOLDER.                     #
# #                                                                           #
# #  Do NOT apply this file as it stands and do NOT commit real values into    #
# #  it. Every value is the literal string REPLACE_ME, which mediaserverd      #
# #  will happily accept and then fail against the real thing: the control     #
# #  plane would trust the token REPLACE_ME from any caller, and the recorder  #
# #  would sign uploads with credentials S3 rejects.                          #
# #                                                                           #
# #  Create it out of band instead, e.g.                                      #
# #                                                                           #
# #    kubectl -n mediaserver create secret generic mediaserverd-secrets \    #
# #      --from-literal=MSS_AUTH_TOKEN="$(openssl rand -hex 32)" \            #
# #      --from-literal=MSS_RECORDING_S3_ACCESS_KEY_ID=... \                  #
# #      --from-literal=MSS_RECORDING_S3_SECRET_ACCESS_KEY=...                #
# #                                                                           #
# #  ...or from your sealed-secrets / external-secrets / vault operator, and   #
# #  drop this file from kustomization.yaml. It is here so the required KEY    #
# #  NAMES are documented in one place.                                       #
# ############################################################################
apiVersion: v1
kind: Secret
metadata:
  name: mediaserverd-secrets
  labels:
    app.kubernetes.io/name: mediaserver
type: Opaque
stringData:
  # Bearer token every control-plane and data-plane caller must present. UNSET
  # OR EMPTY MEANS THE CONTROL PLANE ACCEPTS UNAUTHENTICATED CALLERS -- the
  # daemon logs a warning saying exactly that, and it is the single most
  # important value in this file.
  MSS_AUTH_TOKEN: "REPLACE_ME"

  # Recording storage. Leave BOTH out entirely to let object_store pick up an
  # IRSA / workload-identity role instead; a half-set pair is the failure that
  # looks like a bug.
  MSS_RECORDING_S3_ACCESS_KEY_ID: "REPLACE_ME"
  MSS_RECORDING_S3_SECRET_ACCESS_KEY: "REPLACE_ME"

  # Redis and Kafka credentials travel inside their URLs / broker lists, so
  # when either needs auth, move the whole variable out of the ConfigMap and
  # into this Secret -- envFrom applies the Secret last, so a key here wins
  # over the same key there.
  # MSS_REDIS_URL: "redis://user:password@redis:6379"
  # MSS_KAFKA_BROKERS: "kafka:9092"
