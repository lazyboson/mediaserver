# mediaserverd calls no Kubernetes API: no RBAC Role and no Role binding here,
# on purpose. The account exists so the pod is not the namespace default (which
# tends to accumulate other people's permissions) and so a cloud identity --
# IRSA on EKS, Workload Identity on GKE -- can be annotated onto exactly this
# workload for S3 access without shipping static keys in the Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mediaserverd
  labels:
    app.kubernetes.io/name: mediaserver
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/mediaserverd
automountServiceAccountToken: false
