[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # CDLA-Permissive-2.0 is a data licence, not a code licence, and it is
    # here for exactly one crate: webpki-root-certs, the Mozilla CA root
    # bundle that rustls verifies S3 endpoints against (recording uploads,
    # tasks item 15). It is permissive, imposes no obligation on our own
    # sources, and every Rust HTTPS client ends up on a Mozilla-derived
    # bundle under either this licence or MPL-2.0. Do not widen this entry to
    # cover code.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
