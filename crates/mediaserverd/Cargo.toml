[package]
name = "mediaserverd"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The MSS daemon: Tokio control plane + dedicated real-time media worker threads (the 'two-world' architecture)."

[[bin]]
name = "mediaserverd"
path = "src/main.rs"

[dependencies]
media-core = { path = "../media-core" }
rtpengine-ng = { path = "../rtpengine-ng" }
protocol = { path = "../protocol" }
session-core = { path = "../session-core" }
control-api = { path = "../control-api" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
hound = "3.5.1"
base64 = "0.23.1"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
serde_json = { workspace = true }
crossbeam-queue = "0.3.13"
rskafka = { version = "0.6.0", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
redis = { version = "1.6.0", default-features = false, features = ["tokio-comp"] }
serde = { workspace = true }
object_store = { version = "0.14", default-features = false, features = ["aws-base", "reqwest", "ring"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
