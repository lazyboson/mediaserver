[package]
name = "mediaserverd"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The MSS daemon: Tokio control plane + dedicated real-time media worker threads (the 'two-world' architecture)."

[[bin]]
name = "mediaserverd"
path = "src/main.rs"

[dependencies]
media-core = { path = "../media-core" }
rtpengine-ng = { path = "../rtpengine-ng" }
protocol = { path = "../protocol" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
hound = "3.5.1"
base64 = "0.23.1"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
serde_json = { workspace = true }
