[package]
name = "control-api"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The Session Controller's network surface: the MediaControl gRPC service over the sans-IO session-core state machine."

[dependencies]
session-core = { path = "../session-core" }
media-core = { path = "../media-core" }
tonic = "0.14.6"
tonic-prost = "0.14.6"
prost = "0.14"
prost-types = "0.14"
tokio = { workspace = true }
tokio-stream = { version = "0.1.18", default-features = false, features = ["sync", "net"] }
tracing = { workspace = true }
thiserror = { workspace = true }
hound = "3.5.1"

[build-dependencies]
tonic-prost-build = "0.14.6"
protox = "0.9.1"
